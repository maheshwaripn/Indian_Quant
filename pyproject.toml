[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-quant"
version = "0.2.3"
description = "CPU-first, reproducible Indian equity research with Qlib and optional AI guidance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["indian-trader-skill @ git+https://github.com/maheshwaripn/Indian_Trader_skill.git@2dc03201496e11d9ba671495f2ffe023a0e0ab06", "pyqlib==0.9.7", "pandas>=2.2,<3", "numpy>=1.26,<3", "pyarrow>=15,<23", "scikit-learn>=1.5,<2", "lightgbm>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
yahoo = ["yfinance>=0.2.54,<1"]

[project.scripts]
indian-quant = "indian_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
